<section class="mx-auto max-w-6xl p-6">

  <header class="mb-6 flex items-end justify-between">
    <div>
      <h1 class="text-3xl font-bold text-gray-900">Mes projets</h1>
      <p class="mt-1 text-sm text-gray-500">
        {{ projects.length }} projet{{ projects.length > 1 ? 's' : '' }}
      </p>
    </div>
  </header>

  @if (selectedProject) {
    <div class="mb-6 rounded-lg border border-indigo-200 bg-indigo-50 px-4 py-3 text-sm text-indigo-800">
      Projet sélectionné : <span class="font-semibold">{{ selectedProject.name }}</span>
    </div>
  }

  @if (projects.length > 0) {

    <div class="grid grid-cols-1 gap-6 md:grid-cols-2 lg:grid-cols-3">
      @for (project of projects; track project.id) {
        <div
          class="rounded-lg transition"
          [class.ring-2]="selectedProject?.id === project.id"
          [class.ring-indigo-500]="selectedProject?.id === project.id">
          <app-project-card
            [project]="project"
            (selected)="selectProject($event)">
          </app-project-card>
        </div>
      }
    </div>

  } @else {

    <div class="rounded-lg border border-dashed border-gray-300 p-10 text-center">
      <p class="text-gray-500">Aucun projet disponible.</p>
    </div>

  }

</section>
