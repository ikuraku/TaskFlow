<ul class="space-y-2">
  @for (task of visibleTasks(); track task.id) {
    <li>
      <app-task-item
        [task]="task"
        [showAssignee]="showAssignee()"
        [assigneeName]="getAssigneeName(task.assigneeId)"
        [editable]="editable()"
        (taskStatusChange)="onStatusChange(task.id, $event)"
        (taskDelete)="onDelete(task.id)">
      </app-task-item>
    </li>
  } @empty {
    <li class="rounded border border-dashed border-gray-300 p-4 text-center text-sm text-gray-500">
      Aucune tâche
    </li>
  }
</ul>
